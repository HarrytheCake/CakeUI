modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/HarrytheCake/CakeUI/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "assets/cakeui/icon.png"
authors = "HarrytheCake"
displayURL = "https://github.com/HarrytheCake/CakeUI"
description = '''Redraw Minecraft's main menu, loading screens, HUD and game window from layout folders: elements, variables, 3D tilt, parallax and hot reload, no Java needed. A library for modpacks; it changes nothing until a layout is chosen.'''

[[mixins]]
config = "cakeui.mixins.json"

[[dependencies.cakeui]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.cakeui]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_mc_range}"
ordering = "NONE"
side = "CLIENT"
