# Builds and tests on every push and pull request (Fabric + NeoForge for Minecraft 1.20.4, 1.21.1 and
# 26.1.2; Cake multiloader kit). A push to main whose mod_version has no release yet publishes release
# v<mod_version> with every jar:
#   cakeui-<fabric|neoforge>-<mc>-<version>.jar   one per loader and Minecraft version
#   cakeui-<version>.jar                          the Fabric 1.20.4 jar under its old name (the Cakedition
#                                                 modpack and tools/packwiz_sync.py download this one)
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle runs on JDK 25 (the last one = JAVA_HOME); 1.20.4 compiles with 17, 1.21.1 with 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Read mod version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Check the jars
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -l build/libs
          for f in "cakeui-$VERSION.jar" \
                   cakeui-{fabric,neoforge}-{1.20.4,1.21.1,26.1.2}-"$VERSION".jar; do
            test -f "build/libs/$f" || { echo "missing build/libs/$f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cakeui-${{ steps.version.outputs.version }}
          path: build/libs/cakeui-*${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cakeui-${{ needs.build.outputs.version }}

      - name: Publish release (once per version)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is already released; bump mod_version for a new release."
            exit 0
          fi
          SUMS=$(sha256sum cakeui-*"$VERSION".jar)
          NOTES=$(printf '%s\n\n%s\n\n**SHA-256**\n```\n%s\n```\n' \
            "Fabric and NeoForge for Minecraft 1.20.4, 1.21.1 and 26.1.2: pick \`cakeui-<loader>-<minecraft>-$VERSION.jar\`." \
            "\`cakeui-$VERSION.jar\` is the Fabric 1.20.4 jar under its old name (used by the Monumenta Cakedition modpack)." \
            "$SUMS")
          # --notes goes before the generated notes
          gh release create "v$VERSION" cakeui-*"$VERSION".jar \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CakeUI $VERSION" --generate-notes \
            --notes "$NOTES"
